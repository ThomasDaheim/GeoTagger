// =====================================================================================================================
// GeoTagger build - JavaFX replacement for the parts of GeoSetter that are still needed
// =====================================================================================================================
//
// Requirements
//   - JDK 25 (Gradle toolchain) - Gradle 9 via gradlew
//   - in the local maven repo (~/.m2): tf.ExifToolHelper:ExifToolHelper, tf.GeoHelper:GeoHelper (map) and
//     tf.JavaHelper:JavaHelper (build them in their projects with "gradlew build")
//   - ExifTool: the application asks for it in the preferences; tests look for it in EXIFTOOL_PATH and then on the
//     PATH - without it they are skipped
//
// Main tasks
//   gradlew build  -> compile + test
//   gradlew run    -> start GeoTagger
//   gradlew uiTest -> UI tests (TestFX) - opens windows, keep hands off mouse and keyboard
//
// How JavaFX is wired - same approach as GPXEditor (GeoTagger is non-modular, i.e. runs from the classpath)
//   - compile: JavaFX jars on the classpath are sufficient
//   - run / test / uiTest: the JavaFX jars of the current platform are put on the module path, all other jars stay on
//     the classpath
//   - jdk.jsobject (netscape.javascript.JSObject for the map) comes from JavaFX via --upgrade-module-path - the JDK
//     module is deprecated for removal since JDK 24 (same as GPXEditor)
//   - start scripts (installDist) and jpackage follow later, once there is something to install
// =====================================================================================================================

plugins {
    id 'java'
    id 'application'
    id 'com.google.osdetector' version '1.7.3'
}

group = 'tf.GeoTagger'
version = '0.1'
description = 'GeoTagger - JavaFX replacement for the parts of GeoSetter that are still needed'

// classifier of the platform specific JavaFX jars (win / mac / linux)
def fxPlatform = osdetector.os == 'osx' ? 'mac' : osdetector.os == 'windows' ? 'win' : osdetector.os
def javafxVersion = '25.0.1'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenLocal() {
        // breaking change in gradle 6.*: doesn't find jar files automatically when no pom.xml is present...
        metadataSources {
            mavenPom()
            artifact()
        }
        // only our own libraries come from the local repo - everything else from remote repos
        content {
            includeGroup 'tf.ExifToolHelper'
            includeGroup 'tf.GeoHelper'
            includeGroup 'tf.JavaHelper'
        }
    }
    mavenCentral()
}

dependencies {
    // JavaFX explicit dependencies
    implementation "org.openjfx:javafx-base:$javafxVersion:$fxPlatform"
    implementation "org.openjfx:javafx-graphics:$javafxVersion:$fxPlatform"
    implementation "org.openjfx:javafx-controls:$javafxVersion:$fxPlatform"
    implementation "org.openjfx:javafx-fxml:$javafxVersion:$fxPlatform"
    // map: WebView (needs media) and JSObject from JavaFX
    implementation "org.openjfx:javafx-media:$javafxVersion:$fxPlatform"
    implementation "org.openjfx:javafx-web:$javafxVersion:$fxPlatform"
    implementation "org.openjfx:jdk-jsobject:$javafxVersion:$fxPlatform"

    // our own helper libraries
    implementation 'tf.JavaHelper:JavaHelper:1.17'
    implementation 'tf.ExifToolHelper:ExifToolHelper:0.1'
    implementation 'tf.GeoHelper:GeoHelper:0.1'

    // same look as GPXEditor
    implementation 'org.jfxtras:jmetro:11.6.16'

    // GPX is read with Jackson XML - the same data binding the other applications (e.g. GPXEditor) use
    // BOM: one version for all jackson modules - same as GPXEditor
    implementation platform('com.fasterxml.jackson:jackson-bom:2.21.2')
    implementation 'com.fasterxml.jackson.dataformat:jackson-dataformat-xml'

    testImplementation platform('org.junit:junit-bom:5.13.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'org.junit.jupiter:junit-jupiter-params'
    // test collections (NonUITests / UITests) - same approach as GPXEditor
    testImplementation 'org.junit.platform:junit-platform-suite'
    // UI tests - TestFX needs hamcrest to compile lookup(...) calls
    testImplementation 'org.testfx:testfx-junit5:4.0.18'
    testImplementation 'org.hamcrest:hamcrest:3.0'
    // Gradle 9 doesn't provide the launcher automatically anymore
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// JavaFX needs to be on the module path at runtime - only the platform specific jars
// maven delivers each JavaFX module twice: an empty javafx-base-25.0.1.jar and the real javafx-base-25.0.1-win.jar - keep only the latter
def javafxJars = configurations.runtimeClasspath.filter { it.name.startsWith('javafx-') && !(it.name ==~ /javafx-[a-z]+-[\d.]+\.jar/) }
// jdk.jsobject from JavaFX instead of the JDK - "upgradeable" module: on the normal module path the JDK module would win
def jsobjectJar = configurations.runtimeClasspath.filter { it.name.startsWith('jdk-jsobject-') && !(it.name ==~ /jdk-jsobject-[\d.]+\.jar/) }

// adds "<option> <files>" to javac and the JVM of run / test - evaluated lazily when the task executes (same as GPXEditor)
// option: --module-path for the javafx jars, --upgrade-module-path for jdk.jsobject
abstract class ModulePathArgumentProvider implements CommandLineArgumentProvider {
    @Input
    abstract Property<String> getOption()

    @InputFiles
    @PathSensitive(PathSensitivity.NAME_ONLY)
    abstract ConfigurableFileCollection getModulePath()

    ModulePathArgumentProvider() {
        option.convention('--module-path')
    }

    @Override
    Iterable<String> asArguments() {
        return [option.get(), modulePath.asPath]
    }
}

// no --module-path needed for compiling - only jdk.jsobject, otherwise javac uses the deprecated one of the JDK
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs += ['-Xlint:unchecked', '-Xlint:deprecation']
    options.compilerArgumentProviders.add(objects.newInstance(ModulePathArgumentProvider).tap {
        option = '--upgrade-module-path'
        modulePath.from(jsobjectJar)
    })
}

// JVM options needed to run GeoTagger - JMetro and JavaHelper use JavaFX internals (exports as in GPXEditor)
def jvmFlags = ['--add-modules', 'javafx.controls,javafx.graphics,javafx.base,javafx.fxml,javafx.web',
                '--add-exports', 'javafx.graphics/com.sun.javafx.util=ALL-UNNAMED',
                '--add-exports', 'javafx.base/com.sun.javafx.reflect=ALL-UNNAMED',
                '--add-exports', 'javafx.base/com.sun.javafx.beans=ALL-UNNAMED',
                '--add-exports', 'javafx.base/com.sun.javafx.logging=ALL-UNNAMED',
                '--add-exports', 'javafx.base/com.sun.javafx.runtime=ALL-UNNAMED',
                '--add-exports', 'javafx.base/com.sun.javafx.collections=ALL-UNNAMED',
                '--add-exports', 'javafx.base/com.sun.javafx.event=ALL-UNNAMED',
                '--add-exports', 'javafx.graphics/com.sun.prism=ALL-UNNAMED',
                '--add-exports', 'javafx.graphics/com.sun.javafx.sg.prism=ALL-UNNAMED',
                '--add-exports', 'javafx.graphics/com.sun.javafx.scene=ALL-UNNAMED',
                '--add-exports', 'javafx.controls/com.sun.javafx.scene.control=ALL-UNNAMED',
                '--add-exports', 'javafx.controls/com.sun.javafx.scene.control.behavior=ALL-UNNAMED',
                '--add-exports', 'javafx.controls/com.sun.javafx.scene.control.inputmap=ALL-UNNAMED',
                '--add-exports', 'javafx.graphics/com.sun.javafx.scene.traversal=ALL-UNNAMED',
                '--add-exports', 'javafx.graphics/com.sun.javafx.tk=ALL-UNNAMED',
                '--add-exports', 'javafx.graphics/com.sun.javafx.scene.input=ALL-UNNAMED',
                '--add-opens', 'javafx.graphics/javafx.scene.layout=ALL-UNNAMED',
                '--enable-native-access', 'javafx.graphics',
                '--enable-native-access', 'javafx.web',
                '--enable-native-access', 'ALL-UNNAMED',
    ]

application {
    mainClass = 'tf.geotagger.main.GeoTaggerManager'
    applicationDefaultJvmArgs = jvmFlags + ['-enableassertions']
}

tasks.named('run', JavaExec) {
    jvmArgumentProviders.add(objects.newInstance(ModulePathArgumentProvider).tap { modulePath.from(javafxJars) })
    jvmArgumentProviders.add(objects.newInstance(ModulePathArgumentProvider).tap { option = '--upgrade-module-path'; modulePath.from(jsobjectJar) })
    enableAssertions = true
}

// start scripts (gradlew installDist -> build/install/GeoTagger/bin) - starting without Gradle is about 3 s faster
// they need the javafx jars on the module path - injected with the script's own APP_HOME, same as GPXEditor:
//   windows: DEFAULT_JVM_OPTS gets "--module-path=..." and "--upgrade-module-path=..."; CLASSPATH becomes
//            "<own jar>;lib\*" - the list of all jars is too long for the windows command line
//   unix:    both options are added to the final exec line (DEFAULT_JVM_OPTS doesn't expand $APP_HOME there)
startScripts {
    def ownJar = tasks.named('jar').flatMap { it.archiveFileName }
    def fxJarNames = javafxJars.elements.map { files -> files.collect { it.asFile.name } }
    def jsobjectJarNames = jsobjectJar.elements.map { files -> files.collect { it.asFile.name } }
    doLast {
        def windowsModulePath = fxJarNames.get().collect { "%APP_HOME%\\lib\\${it}" }.join(';')
        def unixModulePath = fxJarNames.get().collect { '$APP_HOME/lib/' + it }.join(':')
        def windowsUpgradePath = jsobjectJarNames.get().collect { "%APP_HOME%\\lib\\${it}" }.join(';')
        def unixUpgradePath = jsobjectJarNames.get().collect { '$APP_HOME/lib/' + it }.join(':')
        windowsScript.text = windowsScript.text.replace('set DEFAULT_JVM_OPTS=', "set DEFAULT_JVM_OPTS=\"--module-path=${windowsModulePath}\" \"--upgrade-module-path=${windowsUpgradePath}\" ")
        windowsScript.text = windowsScript.text.replaceFirst(/(?m)^set CLASSPATH=.*$/, java.util.regex.Matcher.quoteReplacement("set CLASSPATH=%APP_HOME%\\lib\\${ownJar.get()};%APP_HOME%\\lib\\*"))
        unixScript.text = unixScript.text.replace('\nexec "$JAVACMD" "$@"', "\nexec \"\$JAVACMD\" --module-path=\"${unixModulePath}\" --upgrade-module-path=\"${unixUpgradePath}\" \"\$@\"")
    }
}

// after each build the runnable distribution under build/install/GeoTagger is up to date - same as GPXEditor
tasks.named('build') {
    finalizedBy 'installDist'
}

// ---------------------------------------------------------------------------------------------------------------------
// Tests - see docs/superpowers/plans/2026-11-05-plan-ui-test-geruest.md
//   gradlew test                      -> all tests without @Tag("UI") - fast, no windows
//   gradlew uiTest                    -> only @Tag("UI") - opens windows, the robot moves the mouse: hands off!
//   gradlew test --tests <class>      -> exactly that class or suite (e.g. from NetBeans), UI tests included
//   suites for NetBeans: tf.geotagger.testsuites.NonUITests / UITests
// ---------------------------------------------------------------------------------------------------------------------
// with --tests (a single class or suite) everything selected runs; without it the UI tests and the suites are left out
// - otherwise the suites would run all tests a second time
def testsFiltered = gradle.startParameter.taskRequests.any { it.args.contains('--tests') }
// TestFX reads the application parameters via JavaFX internals
def testJvmFlags = jvmFlags + ['--add-opens', 'javafx.graphics/com.sun.javafx.application=ALL-UNNAMED']

tasks.withType(Test).configureEach {
    jvmArgumentProviders.add(objects.newInstance(ModulePathArgumentProvider).tap { modulePath.from(javafxJars) })
    jvmArgumentProviders.add(objects.newInstance(ModulePathArgumentProvider).tap { option = '--upgrade-module-path'; modulePath.from(jsobjectJar) })
    jvmArgs(testJvmFlags)
    // every UI test starts a WebView for the map
    maxHeapSize = '1g'
    // tests use their own preferences node - the real settings of GeoTagger stay untouched
    systemProperty 'geotagger.preferences', 'tf/geotagger/test'
    // TestFX moves the mouse with the AWT robot
    systemProperty 'java.awt.headless', 'false'
    testLogging.showStandardStreams = true
}

tasks.named('test', Test) {
    useJUnitPlatform {
        if (!testsFiltered) {
            excludeTags 'UI'
            excludeEngines 'junit-platform-suite'
        }
    }
}

tasks.register('uiTest', Test) {
    description = 'Runs the UI tests - opens windows, keep hands off mouse and keyboard.'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeTags 'UI'
        excludeEngines 'junit-platform-suite'
    }
}
